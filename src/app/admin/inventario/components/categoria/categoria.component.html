<div class="card">
    <h1>Categoría</h1>
    
    <ul>
        @for (cat of categorias; track $index){
            <li> {{cat.nombre}} - {{cat.detalle}} </li>
        }
    </ul>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Detalle</th>
            </tr>
        </thead>
        <body>
            @for (cat of categorias; track $index){
                <tr>
                    <td>{{cat.id}} </td>
                    <td>{{cat.nombre}} </td>
                    <td>{{cat.detalle}} </td>
                </tr>
            }
        </body>
    </table>
</div>
